events { worker_connections 1024; }

http {
  # Docker Compose embedded DNS. Using a resolver + variable proxy_pass defers
  # upstream name resolution to request time, so nginx starts even if a service
  # is briefly down and picks up new container IPs after a restart.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Map the Connection header so WebSocket upgrades (Next.js HMR) pass through.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ---- HTTP :80 -> redirect everything to HTTPS ----------------------
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ---- HTTPS :443 -> TLS termination + routing -----------------------
  server {
    listen 443 ssl;
    server_name _;

    # Local self-signed cert (CN=localhost, SAN localhost/127.0.0.1).
    # Generated with openssl; mounted from ./nginx/certs (not committed).
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---- Backend / API -> API Gateway --------------------------------
    location /api/v1/ {
      set $gateway http://api-gateway:8000;
      rewrite ^/api/v1/(.*)$ /v1/$1 break;
      proxy_pass $gateway;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Everything else -> Next.js frontend -------------------------
    location / {
      set $frontend http://frontend:3000;
      proxy_pass $frontend;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket upgrade for Next.js dev HMR.
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }
  }
}
