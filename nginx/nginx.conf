events { worker_connections 1024; }

http {
  # Redirect all HTTP to HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # W2 D6: route /api/users/* -> user-service:8002
    location ~* ^/api/users/(.*)$ {
      proxy_pass http://user-service:8002;
    }

    # W2 D6: route /api/questions/* -> question-management-service:8003
    location ~* ^/api/questions/(.*)$ {
      proxy_pass http://question-management-service:8003;
    }

    # W2 D6: route /api/sessions/* -> test-management-service:8001
    location ~* ^/api/sessions/(.*)$ {
      proxy_pass http://test-management-service:8001;
    }

    # W2 D6: default fallback to frontend:3000
    location / {
      proxy_pass http://frontend:3000;
    }
  }
}
