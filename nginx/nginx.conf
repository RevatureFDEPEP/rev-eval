events {
  worker_connections 1024;
}

http {
  include      /etc/nginx/mime.types;  # maps file extensions to Content-Type headers
  default_type application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;  # reuse TCP connections for 65s to reduce handshake overhead

  # Rate limiting: auth endpoints strict (5 req/min), general API relaxed (30 req/min)
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/m;

  # Sends Connection: upgrade only for WebSocket handshakes, close otherwise
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream frontend {
    server frontend:3000;  # Next.js SSR + BFF
  }

  upstream api_gateway {
    server api-gateway:8000;  # JWT-verifying gateway; forwards X-User-* headers downstream
  }

  # Redirect all HTTP to HTTPS
  server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/self-signed.crt;
    ssl_certificate_key /etc/nginx/certs/self-signed.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10M;  # allows question image uploads via MinIO

    # Auth endpoints — strict rate limit to slow brute-force attempts
    # Rewrites /api/v1/auth/* → /v1/api/auth/* before forwarding to gateway
    location /api/v1/auth/ {
      limit_req zone=auth_limit burst=5 nodelay;
      rewrite   ^/api/v1/(.*)$ /v1/api/$1 break;
      proxy_pass         http://api_gateway;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_redirect        off;
      proxy_read_timeout    30s;
      proxy_connect_timeout 10s;
    }

    # All other API traffic — relaxed rate limit
    # Rewrites /api/v1/* → /v1/api/* before forwarding to gateway
    location /api/v1/ {
      limit_req zone=api_limit burst=20 nodelay;
      rewrite   ^/api/v1/(.*)$ /v1/api/$1 break;
      proxy_pass         http://api_gateway;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_redirect        off;
      proxy_read_timeout    30s;
      proxy_connect_timeout 10s;
    }

    # Gateway diagnostic endpoints — no JWT or rate limit required
    location ~ ^/(health|routes)$ {
      proxy_pass       http://api_gateway;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect   off;
    }

    # Next.js static assets — no WebSocket headers needed
    location /_next/ {
      proxy_pass         http://frontend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_redirect        off;
      proxy_read_timeout    30s;
      proxy_connect_timeout 10s;
    }

    # Pages and all other frontend routes — WebSocket upgrade for Next.js HMR in dev
    location / {
      proxy_pass         http://frontend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_redirect        off;
      proxy_read_timeout    60s;
      proxy_connect_timeout 10s;
    }
  }
}
