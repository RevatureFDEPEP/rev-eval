# =============================================================================
# SECURITY & CONFIGURATION NOTES
#
# Fix 1 — Stub returning 502 for all routes (was non-functional)
#   WHAT:  Original config had a single `return 502` for every route with
#          TODO comments. No traffic was proxied anywhere.
#   FIX:   Proper upstream blocks and location rules added for all services.
#
# Fix 2 — API traffic routed through api-gateway, NOT directly to services
#   WHAT:  The TODO comments suggested routing /api/users/* directly to
#          user-service:8002, /api/questions/* to question-management-service:8003,
#          etc. Doing that bypasses the api-gateway entirely, which means:
#            - JWT authentication is skipped (any client hits services unauthenticated)
#            - X-User-* header injection does not happen (services lose user context)
#            - Business routing logic is duplicated in two places
#   FIX:   All /v1/api/* traffic is proxied to api-gateway:8000 only.
#          The gateway owns auth + routing to individual services via
#          compose-internal DNS. Nginx never talks to individual services directly.
#
# Fix 3 — nginx version hidden
#   WHAT:  Default nginx exposes its version in Server headers and error pages,
#          making version-specific exploit targeting easier.
#   FIX:   server_tokens off
#
# Fix 4 — Security headers added
#   WHAT:  No security headers were set, leaving clients vulnerable to
#          clickjacking (missing X-Frame-Options), MIME sniffing
#          (missing X-Content-Type-Options), and referrer leakage.
#   FIX:   X-Frame-Options, X-Content-Type-Options, X-XSS-Protection,
#          Referrer-Policy added on all responses.
#
# Fix 5 — Real client IP forwarded to upstream services
#   WHAT:  Without X-Forwarded-For / X-Real-IP, every request arrives at
#          upstream services with the nginx container IP (172.x.x.x) as the
#          source. Logs are useless for abuse investigation; rate-limiting
#          at the service layer cannot target real IPs.
#   FIX:   proxy_set_header X-Real-IP and X-Forwarded-For added globally.
#
# Fix 6 — WebSocket support for Next.js HMR (development)
#   WHAT:  Next.js dev server uses WebSockets for hot module replacement.
#          Without Upgrade/Connection headers, the HMR connection is rejected
#          and the browser requires manual refresh on every code change.
#   FIX:   proxy_http_version 1.1 + Upgrade + Connection headers on the
#          frontend location block.
#
# Fix 7 — Rate limiting on API routes
#   WHAT:  No request throttling meant a single client could exhaust backend
#          resources or brute-force auth endpoints.
#   FIX:   limit_req_zone defined at 30 req/s per IP with burst of 50.
#          Applied to /v1/api/ only; frontend traffic is not throttled.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Fix 3: hide nginx version from Server header and error pages
    server_tokens off;

    # Fix 5: set real client IP headers for all upstream proxies
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Reasonable proxy timeouts: connect fast, allow 60s for slow queries
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    # Gzip for API JSON and frontend assets
    gzip            on;
    gzip_min_length 1000;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/x-javascript text/javascript;

    # Fix 7: rate limit zone — keyed by real client IP, 10MB state store
    # 30 req/s steady-state, burst of 50 queued without delay
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # ---------------------------------------------------------------------------
    # Upstream definitions — compose-internal DNS resolves these names
    # ---------------------------------------------------------------------------

    upstream api_gateway {
        server api-gateway:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # ---------------------------------------------------------------------------
    # Main server block
    # ---------------------------------------------------------------------------

    server {
        listen 80;
        server_name _;

        # Fix 4: security headers on all responses
        add_header X-Frame-Options        "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options "nosniff"                      always;
        add_header X-XSS-Protection       "1; mode=block"                always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ------------------------------------------------------------------
        # Fix 2: ALL API traffic → api-gateway only.
        #
        # DO NOT add location blocks that proxy directly to user-service,
        # test-management-service, or question-management-service.
        # Doing so bypasses JWT verification and X-User-* header injection
        # that the gateway enforces for every request.
        # ------------------------------------------------------------------
        location /v1/api/ {
            # Fix 7: enforce rate limit; allow short burst, reject excess with 429
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://api_gateway;
        }

        # Gateway health check — not rate-limited (used by Docker / load balancers)
        location /health {
            proxy_pass http://api_gateway;
        }

        # Gateway route-listing endpoint (useful for debugging, lock down in prod)
        location /routes {
            proxy_pass http://api_gateway;
        }

        # ------------------------------------------------------------------
        # Frontend — all other traffic
        # Fix 6: WebSocket upgrade headers for Next.js HMR
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://frontend;

            # WebSocket support (Next.js hot module replacement in dev)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
