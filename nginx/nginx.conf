# Single entry point on :80 — routes to api-gateway or frontend based on path prefix
events {
  worker_connections 1024;
}

http {
  include      /etc/nginx/mime.types;  # maps file extensions to Content-Type headers
  default_type application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;  # reuse TCP connections for 65s to reduce handshake overhead

  # Sends Connection: upgrade only when client requests a WebSocket upgrade; otherwise close
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream frontend {
    server frontend:3000;  # Next.js SSR + BFF
  }

  upstream api_gateway {
    server api-gateway:8000;  # JWT-verifying gateway; forwards X-User-* headers downstream
  }

  server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;  # allows question image uploads via MinIO

    # All versioned API calls — gateway handles JWT verification and service routing
    location /v1/api/ {
      proxy_pass         http://api_gateway;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_redirect        off;
      proxy_read_timeout    30s;
      proxy_connect_timeout 10s;
    }

    # Gateway diagnostic endpoints — no JWT required
    location ~ ^/(health|routes)$ {
      proxy_pass       http://api_gateway;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect   off;
    }

    # Pages, static assets, and Next.js BFF routes (/api/auth/*, /api/v1/*)
    location / {
      proxy_pass         http://frontend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;  # upgrade for WS, close otherwise
      proxy_redirect        off;
      proxy_read_timeout    60s;
      proxy_connect_timeout 10s;
    }
  }
}
