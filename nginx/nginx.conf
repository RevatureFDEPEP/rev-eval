events {
  worker_connections 1024;
}

http {
  log_format rev_eval_json escape=json
    '{'
      '"timestamp":"$time_iso8601",'
      '"level":"INFO",'
      '"log_type":"nginx_access",'
      '"service":"nginx",'
      '"request_id":"$request_id",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":"$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"upstream_status":"$upstream_status",'
      '"http_referer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"'
    '}';

  access_log /var/log/nginx/access.log rev_eval_json;
  error_log /var/log/nginx/error.log warn;

  # upstreams
  upstream frontend_upstream {
    server frontend:3000;
  }

  upstream api_gateway_upstream {
    server api-gateway:8000;
  }

  # shared proxy headers
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;

  # HTTP redirect to HTTPS
  server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
  }

  # TLS server configuration to handle HTTPS traffic
  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    location ^~ /api/v1/ {
      rewrite ^/api/v1/(.*)$ /v1/$1 break;
      proxy_set_header Authorization "Bearer $cookie_auth_token";
      proxy_pass http://api_gateway_upstream;
    }

    location ^~ /_next/ {
      proxy_pass http://frontend_upstream;
    }

    location / {
      proxy_pass http://frontend_upstream;
    }
  }
}
