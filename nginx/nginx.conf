events { worker_connections 1024; }

http {
  server {
    listen 80;

    # /api/users/* → user-service (rewrite: strip /api/, prepend /v1/api/)
    location /api/users/ {
      proxy_pass         http://user-service:8002/v1/api/users/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # /api/questions/* → question-management-service
    location /api/questions/ {
      proxy_pass         http://question-management-service:8003/v1/api/questions/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # /api/sessions/* → test-management-service (/api/sessions/tests/1 → /v1/api/tests/1)
    location /api/sessions/ {
      proxy_pass         http://test-management-service:8001/v1/api/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Default → frontend (WebSocket upgrade for Next.js dev HMR)
    location / {
      proxy_pass         http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
  }
}
