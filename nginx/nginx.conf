events { worker_connections 1024; }

http {
  # Docker Compose embedded DNS. Using a resolver + variable proxy_pass defers
  # upstream name resolution to request time, so nginx starts even if a service
  # is briefly down and picks up new container IPs after a restart.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Map the Connection header so WebSocket upgrades (Next.js HMR) pass through.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Correlation id for distributed log tracing: pass through the client's
  # X-Correlation-Id, falling back to nginx's built-in unique $request_id
  # so every externally-originated request carries an id. The gateway's
  # middleware is a second safety net for traffic that bypasses nginx.
  map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ''      $request_id;
  }

  # JSON access logs -> stdout, shipped to Loki by Promtail. Fields feed
  # the Grafana dashboard (status codes, request_time percentiles) and
  # share the correlation_id key with the Python services' JSON logs.
  log_format json_combined escape=json '{'
    '"ts":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"body_bytes_sent":$body_bytes_sent,'
    '"correlation_id":"$correlation_id"'
  '}';
  access_log /dev/stdout json_combined;

  # ---- HTTP :80 -> redirect everything to HTTPS ----------------------
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ---- HTTPS :443 -> TLS termination + routing -----------------------
  server {
    listen 443 ssl;
    server_name _;

    # Local self-signed cert (CN=localhost, SAN localhost/127.0.0.1).
    # Generated with openssl; mounted from ./nginx/certs (not committed).
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---- Backend / API -> API Gateway --------------------------------
    # Browser calls /api/v1/* . The gateway's ROUTES table matches /v1/api/* ,
    # so strip the leading /api:
    #   /api/v1/api/users/me  ->  /v1/api/users/me
    # Auth (cookie -> Bearer) is handled by the gateway's auth_token fallback,
    # so the BFF is not needed for these data calls.
    #
    # NOTE: /api/auth/* is intentionally NOT matched here. Login/register must
    # hit the Next.js BFF (frontend) so it can set the httpOnly auth_token
    # cookie; those fall through to the `location /` block below.
    location /api/v1/ {
      set $gateway http://api-gateway:8000;
      rewrite ^/api/v1/(.*)$ /v1/$1 break;
      proxy_pass $gateway;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id  $correlation_id;
    }

    # ---- Everything else -> Next.js frontend -------------------------
    # Covers /, /_next/*, static assets, and the BFF routes (/api/auth/*,
    # any other /api/* the frontend still serves).
    location / {
      set $frontend http://frontend:3000;
      proxy_pass $frontend;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id  $correlation_id;

      # WebSocket upgrade for Next.js dev HMR.
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
