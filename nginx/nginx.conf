events {
  worker_connections 1024;
}

http {
  log_format rev_eval_json escape=json
    '{'
      '"timestamp":"$time_iso8601",'
      '"level":"INFO",'
      '"log_type":"nginx_access",'
      '"service":"nginx",'
      '"request_id":"$request_id",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":"$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"upstream_status":"$upstream_status",'
      '"http_referer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"'
    '}';

  access_log /var/log/nginx/access.log rev_eval_json;
  error_log /var/log/nginx/error.log warn;

  # Brute-force protection for authentication endpoints: ~5 requests/minute
  # per client IP. Bursts of up to 5 are queued without delay; excess is
  # rejected with 429.
  limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
  limit_req_status 429;

  # Cap request bodies to a sane default (uploads still flow through the app).
  client_max_body_size 10m;

  # upstreams
  upstream frontend_upstream {
    server frontend:3000;
  }

  upstream api_gateway_upstream {
    server api-gateway:8000;
  }

  # shared proxy headers
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Discard any client-supplied X-Forwarded-For; trust only the real peer addr
  # so forwarded-header values cannot be spoofed by the caller.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;

  # proxy timeouts
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # HTTP redirect to HTTPS
  server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
  }

  # TLS server configuration to handle HTTPS traffic
  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    # TLS hardening: modern protocols only, server-chosen modern ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (applied to all responses on this server).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # NOTE: a Content-Security-Policy is intentionally omitted here — Next.js
    # asset/runtime behavior must be validated against any policy before it is
    # enabled to avoid breaking the frontend.

    # Rate-limited authentication endpoints (login/register). Must precede the
    # generic /api/v1/ location so it wins for these paths.
    location ~ ^/api/v1/api/auth/(login|register)$ {
      limit_req zone=auth_login burst=5 nodelay;
      rewrite ^/api/v1/(.*)$ /v1/$1 break;
      proxy_set_header Authorization "Bearer $cookie_auth_token";
      proxy_pass http://api_gateway_upstream;
    }

    location ^~ /api/v1/ {
      rewrite ^/api/v1/(.*)$ /v1/$1 break;
      proxy_set_header Authorization "Bearer $cookie_auth_token";
      proxy_pass http://api_gateway_upstream;
    }

    location ^~ /_next/ {
      proxy_pass http://frontend_upstream;
    }

    location / {
      proxy_pass http://frontend_upstream;
    }
  }
}
