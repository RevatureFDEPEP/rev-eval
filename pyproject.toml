[tool.ruff]
line-length = 88
target-version = "py311"
src = ["services"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # function call in default args (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = [
    "api_gateway",
    "user_service",
    "question_management",
    "test_management",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
