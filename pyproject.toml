[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B"]
ignore = [
    # Existing FastAPI route dependencies intentionally use Depends/Query defaults.
    "B008",
    # Exception chaining cleanup is valuable but too broad for this CI-gates change.
    "B904",
    # Keep the configured line length for formatting without blocking long seed strings.
    "E501",
]
