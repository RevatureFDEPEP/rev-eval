services:
  postgres:
    image: postgres:15-alpine
    container_name: rev-eval-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-eval_ai_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: rev-eval-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-evalai}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10
  
  minio:
    image: minio/minio:latest
    container_name: rev-eval-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
  
  loki:
    image: grafana/loki:3.5.1
    container_name: rev-eval-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana:12.0.1
    container_name: rev-eval-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy

  alloy:
    image: grafana/alloy:v1.9.1
    container_name: rev-eval-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - "12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: rev-eval-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api-gateway
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: rev-eval-user-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-root}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-root}
      DB_NAME: ${POSTGRES_DB:-eval_ai_dev}
      SERVICE_NAME: user-service
      PORT: 8002
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      ALLOW_ORIGINS: http://localhost:3000
    # Internal microservice — published to loopback ONLY (127.0.0.1) for local
    # debugging. It trusts gateway-injected X-User-* identity headers, so it
    # must not be reachable from the LAN/host network where a caller could
    # bypass the gateway and spoof identity. The API gateway (:8000) is the
    # only intended public entry point. Reach it over Docker DNS in-network.
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  question-management-service:
    build:
      context: ./services/question-management-service
      dockerfile: Dockerfile
    container_name: rev-eval-question-management
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGODB_PASSWORD:-admin}@mongo:27017/${MONGO_DB:-evalai}?authSource=admin
      MONGO_DB: ${MONGO_DB:-evalai}
      MONGO_APPNAME: rev-eval
      SERVICE_NAME: question-management-service
      PORT: 8003
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-question-images}
      ALLOW_ORIGINS: http://localhost:3000
    # Internal microservice — loopback-only publish (see user-service note).
    # Answer keys are role-gated on its read endpoints; the gateway sets the
    # verified caller role. Trusted server-to-server callers (test-management's
    # quiz session snapshot fetch) reach it over Docker DNS, not this port.
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  test-management-service:
    build:
      context: ./services/test-management-service
      dockerfile: Dockerfile
    container_name: rev-eval-test-management
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-root}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-root}
      DB_NAME: ${POSTGRES_DB:-eval_ai_dev}
      SERVICE_NAME: test-management-service
      PORT: 8001
      SERVICE_HOSTNAME: test-management-service
      USER_SERVICE_URL: http://user-service:8002
      QUESTION_SERVICE_URL: http://question-management-service:8003
      ALLOW_ORIGINS: http://localhost:3000
    # Internal microservice — loopback-only publish (see user-service note).
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  reporting-and-analytics-service:
    build:
      context: ./services/reporting-and-analytics-service
      dockerfile: Dockerfile
    container_name: rev-eval-reporting-analytics
    restart: unless-stopped
    environment:
      SERVICE_NAME: reporting-and-analytics-service
      PORT: 8004
      TEST_MANAGEMENT_URL: http://test-management-service:8001
      ALLOW_ORIGINS: http://localhost:3000
    # Internal microservice — published to loopback ONLY. It trusts
    # gateway-injected X-User-* role headers, so it must not be reachable off
    # host where a caller could bypass the gateway. Reach it via Docker DNS.
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      test-management-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    build:
      context: ./services/api-gateway-service
      dockerfile: Dockerfile
    container_name: rev-eval-api-gateway
    restart: unless-stopped
    environment:
      SERVICE_NAME: api-gateway
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ALLOW_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      user-service:
        condition: service_healthy
      test-management-service:
        condition: service_healthy
      question-management-service:
        condition: service_healthy
      reporting-and-analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: rev-eval-frontend
    restart: unless-stopped
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
      NEXT_PUBLIC_SITE_URL: https://localhost
      NEXT_PUBLIC_API_GATEWAY_URL: /api/v1
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  mongo_data:
  minio_data:
  loki_data:
  grafana_data:
  alloy_data:
