<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1150" width="1400" height="1150" role="img" aria-label="Rev-Eval logical architecture. Trainers and participants reach Nginx over HTTPS. Nginx terminates TLS, redirects HTTP to HTTPS, rate-limits the API path and adds security headers, then forwards page and BFF traffic to the Next.js frontend and /v1/api traffic to the API gateway. The Next.js BFF reads the JWT from an httpOnly cookie and calls the gateway with a Bearer token. Inside the private Docker network the gateway verifies the JWT and routes to user-service, test-management, reporting-and-analytics and question-management with identity headers and a request ID. User, test, session and score data live in PostgreSQL, which reporting reads with read-only queries; questions live in MongoDB and question images in MinIO. GitHub Actions CI runs lint, tests with a diff-coverage gate, Trivy scans and the frontend build.">
