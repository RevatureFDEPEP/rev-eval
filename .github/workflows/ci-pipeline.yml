name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: 

jobs:
  backend-build-test:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    env:
      JWT_SECRET: ${{ secrets.JWT_SIGNING_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - question-management-service
          - test-management-service
          - api-gateway-service
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Verify JWT_SECRET is set #might be a security vulnerability might leak log data -> modify echoing or length tracking to native runner step expressions 
        run: |
          if [ -z "${JWT_SECRET}" ]; then
            echo "❌ JWT_SECRET is empty — was the repo secret configured?"
            exit 1
          fi
          echo "✅ JWT_SECRET length: ${#JWT_SECRET}" 

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          pip install pytest pytest-cov

      - name: Lint (ruff)
        working-directory: services/${{ matrix.service }}
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            pytest --cov --cov-report=xml --cov-fail-under=70
          else
            echo "No tests/ directory in services/${{ matrix.service }} — skipping pytest."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml

      - name: Build production image
        working-directory: services/${{ matrix.service }}
        run: docker build --target production -t ${{ matrix.service }}:ci .

      - name: Scan for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:ci
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}


  frontend-build-test:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4 #version mismatch frontend uses v4 

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'frontend/.next/**/*'

      - name: Test
        working-directory: frontend
        run: pnpm test --if-present

        #There's no step to push images to a registry or deploy anywhere, making it CI-only with no CD.
        #docker related actions?? should we not build a new image everytime?? is it an exercise for us to include?? 
