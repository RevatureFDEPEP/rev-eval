name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:


jobs:
  backend-build-test:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ${{ secrets.JWT_SIGNING_SECRET }}
      PYTHONPATH: ${{ github.workspace }}/services/${{ matrix.service }}
      DB_HOST: localhost
      DB_USERNAME: test
      DB_PASSWORD: test
      DB_NAME: test
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - question-management-service
          - test-management-service
          - api-gateway-service
    steps:
      # Use the newer checkout action for consistent behavior across jobs
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Verify JWT_SECRET is set
        run: |
          if [ -z "${JWT_SECRET}" ]; then
            echo "❌ JWT_SECRET is empty — was the repo secret configured?"
            exit 1
          fi
          echo "✅ JWT_SECRET length: ${#JWT_SECRET}"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov aiosqlite

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            pytest --cov --cov-report=xml
          else
            echo "⚠️ No tests found — skipping for ${{ matrix.service }}"
          fi

      # NOTE: Trivy + Ruff scans added in W2 D7 by candidates (not seeded here)

  frontend-build-test:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Archive build output
        run: tar -czf frontend-build.tar.gz -C frontend .next

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'frontend-build.tar.gz'

      - name: Test
        working-directory: frontend
        run: pnpm test --if-present #Will remove the --if-present flag once we have tests in place
