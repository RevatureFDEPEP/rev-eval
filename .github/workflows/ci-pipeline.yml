name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write

jobs:
  backend-build-test:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SIGNING_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - question-management-service
          - test-management-service
          - api-gateway-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements.txt
            services/requirements-dev.txt

      - name: Verify JWT_SECRET is set
        run: |
          if [ -z "${JWT_SECRET}" ]; then
            echo "❌ JWT_SECRET is empty — was the repo secret configured?"
            exit 1
          fi
          echo "✅ JWT_SECRET length: ${#JWT_SECRET}"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          # Install service runtime dependencies first, then shared test/dev dependencies.
          pip install -r requirements.txt
          pip install -r ../requirements-dev.txt

      - name: Ruff lint
        working-directory: services/${{ matrix.service }}
        run: ruff check .

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            pytest --cov --cov-report=xml --cov-fail-under=70
          else
            echo "No tests/ directory in services/${{ matrix.service }} — skipping pytest."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          if-no-files-found: ignore

      - name: Build Docker image
        run: docker build -t rev-eval-${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rev-eval-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: '1'
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: 'true'
          limit-severities-for-sarif: 'true'

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

      - name: Upload Trivy SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
          if-no-files-found: ignore

  frontend-build-test:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
           # Match frontend/package.json packageManager: pnpm@9.15.0.
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-path: 'frontend/.next/BUILD_ID'

      - name: Test
        working-directory: frontend
        run: pnpm test --if-present
