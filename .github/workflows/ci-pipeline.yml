name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set.outputs.backend }}
      backend_any: ${{ steps.set.outputs.backend_any }}
      frontend: ${{ steps.set.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user-service: ['services/user-service/**']
            question-management-service: ['services/question-management-service/**']
            test-management-service: ['services/test-management-service/**']
            api-gateway-service: ['services/api-gateway-service/**']
            backend-shared: ['pyproject.toml', '.github/workflows/ci-pipeline.yml']
            frontend: ['frontend/**', '.github/workflows/ci-pipeline.yml']

      - name: Build job set
        id: set
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          EVENT: ${{ github.event_name }}
        run: |
          all='["user-service","question-management-service","test-management-service","api-gateway-service"]'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            backend="$all"; frontend=true
          else
            if echo "$CHANGED" | jq -e 'index("backend-shared")' >/dev/null; then
              backend="$all"
            else
              # intersection of changed filters with the backend service list
              backend=$(jq -cn --argjson a "$all" --argjson c "$CHANGED" '$a - ($a - $c)')
            fi
            frontend=$(echo "$CHANGED" | jq -e 'index("frontend")' >/dev/null && echo true || echo false)
          fi
          backend_any=$([ "$(echo "$backend" | jq 'length')" -gt 0 ] && echo true || echo false)
          {
            echo "backend=$backend"
            echo "backend_any=$backend_any"
            echo "frontend=$frontend"
          } >> "$GITHUB_OUTPUT"
          echo "backend=$backend | frontend=$frontend"

  backend-build-test:
    name: Backend (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.backend_any == 'true'
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SIGNING_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.backend) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Verify JWT_SECRET is set
        run: |
          if [ -z "${JWT_SECRET}" ]; then
            echo "❌ JWT_SECRET is empty — was the repo secret configured?"
            exit 1
          fi
          echo "✅ JWT_SECRET length: ${#JWT_SECRET}"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: ruff check .

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            # Coverage source/omit and the fail_under threshold come from the
            # service's .coveragerc (measured-baseline ratchet, W2 D7 gate).
            pytest --cov --cov-report=xml
          else
            echo "No tests/ directory in services/${{ matrix.service }} — skipping pytest."
          fi

  frontend-build-test:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Lint
        working-directory: frontend
        run: pnpm lint || echo "eslint failed and skip for the next step"

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Test
        working-directory: frontend
        run: pnpm test --if-present
