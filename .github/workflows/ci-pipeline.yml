name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-build-test:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SIGNING_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - question-management-service
          - test-management-service
          - api-gateway-service
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Verify JWT_SECRET is set
        run: |
          if [ -z "${JWT_SECRET}" ]; then
            echo "❌ JWT_SECRET is empty — was the repo secret configured?"
            exit 1
          fi
          echo "✅ JWT_SECRET length: ${#JWT_SECRET}"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint with ruff
        working-directory: services/${{ matrix.service }}
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            pytest --cov --cov-report=xml --cov-fail-under=70
          else
            echo "No tests/ directory in services/${{ matrix.service }} — skipping pytest."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          if-no-files-found: ignore

      - name: Build Docker image for Trivy scan
        run: |
          docker build -t ${{ matrix.service }}:ci services/${{ matrix.service }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ matrix.service }}:ci'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
          if-no-files-found: ignore

  docker-lint:
    name: Docker Lint (run-linter.sh)
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: eval_ai_dev
      JWT_SECRET: ${{ secrets.JWT_SIGNING_SECRET }}
    steps:
      - uses: actions/checkout@v3

      - name: Start backend containers
        run: |
          docker compose up -d postgres mongo minio user-service question-management-service test-management-service api-gateway
          echo "Waiting for services to be healthy..."
          timeout 120 bash -c 'until docker compose ps | grep -v "starting" | grep -q "healthy"; do sleep 5; done'
          docker compose ps

      - name: Run run-linter.sh
        run: bash run-linter.sh

      - name: Stop containers
        if: always()
        run: docker compose down

  frontend-build-test:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'frontend/.next/**/*'

      - name: Test
        working-directory: frontend
        run: pnpm test --if-present
