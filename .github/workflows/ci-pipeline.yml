name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-build-test:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SIGNING_SECRET }}
      PYTHONPATH: ${{ github.workspace }}/services/${{ matrix.service }}
      DB_HOST: localhost
      DB_USERNAME: test
      DB_PASSWORD: test
      DB_NAME: test
      ALLOW_ORIGINS: "http://localhost:3000,http://localhost:8000"
      SERVICE_NAME: ${{ matrix.service }}
      PORT: "8004"
      SERVICE_HOSTNAME: "localhost"
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - question-management-service
          - test-management-service
          - api-gateway-service
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Verify JWT_SECRET is set
        run: |
          if [ -z "${JWT_SECRET}" ]; then
            echo "❌ JWT_SECRET is empty — was the repo secret configured?"
            exit 1
          fi
          echo "✅ JWT_SECRET length: ${#JWT_SECRET}"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov aiosqlite diff-cover ruff

      - name: Lint (ruff)
        working-directory: services/${{ matrix.service }}
        run: ruff check .

      - name: Run pytest with coverage
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            pytest --cov=src --cov-report=xml
          else
            echo "⚠️ No tests found — skipping for ${{ matrix.service }}"
          fi

      - name: Diff coverage (changed lines only)
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f coverage.xml ]; then
            git fetch origin main --depth=1 || true
            diff-cover coverage.xml --compare-branch=origin/main --fail-under=80
          fi

  trivy-scan:
    name: Trivy Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - question-management-service
          - test-management-service
          - api-gateway-service
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.19.0

        with:
          scan-type: fs
          scan-ref: services/${{ matrix.service }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  frontend-build-test:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Lint (zero warnings)
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Archive build output
        run: tar -czf frontend-build.tar.gz -C frontend .next

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'frontend-build.tar.gz'

      - name: Test
        working-directory: frontend
        run: pnpm test --if-present
  ci-gate:
      name: CI Gate
      runs-on: ubuntu-latest
      needs: [backend-build-test, frontend-build-test, trivy-scan]
      if: always()
      steps:
        - name: Check all required jobs passed
          run: |
            echo "=== Job Results ==="
            echo "backend-build-test: ${{ needs.backend-build-test.result }}"
            echo "frontend-build-test: ${{ needs.frontend-build-test.result }}"
            echo "trivy-scan: ${{ needs.trivy-scan.result }}"
            echo "=================="
            
            if [[ "${{ needs.backend-build-test.result }}" == "failure" ]]; then
              echo "❌ Backend tests failed"
              exit 1
            fi
            if [[ "${{ needs.frontend-build-test.result }}" == "failure" ]]; then
              echo "❌ Frontend tests failed"
              exit 1
            fi
            if [[ "${{ needs.trivy-scan.result }}" == "failure" ]]; then
              echo "❌ Trivy scan failed"
              exit 1
            fi
            echo "✅ All checks passed"