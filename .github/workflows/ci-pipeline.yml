name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: 

jobs:
  backend-build-test:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SIGNING_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - question-management-service
          - test-management-service
          - api-gateway-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Verify JWT_SECRET is set
        run: |
          if [ -z "${JWT_SECRET}" ]; then
            echo "❌ JWT_SECRET is empty — was the repo secret configured?"
            exit 1
          fi
          echo "✅ JWT_SECRET is set"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          pip install pytest pytest-cov

      - name: Lint (ruff)
        working-directory: services/${{ matrix.service }}
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            pytest --cov --cov-report=xml --cov-fail-under=70
          else
            echo "No tests/ directory in services/${{ matrix.service }} — skipping pytest."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml

      # W3-F5: integration tests against real Postgres + Mongo, ahead of the
      # Docker build so a lock/idempotency regression fails the pipeline before
      # any image is produced. The compose file is the source of truth for the
      # containers (images, env, healthchecks); --wait blocks until every
      # started service is healthy. question-management-service rides along
      # because session creation exercises the real $sample cross-service call.
      # The hermetic pytest step above runs without --integration, so this
      # suite is skipped there and the coverage gate is unaffected. Only
      # test-management-service has an integration suite today.
      - name: Start integration containers (Postgres, Mongo, question-service)
        if: matrix.service == 'test-management-service'
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres mongo question-management-service

      - name: Run integration tests
        if: matrix.service == 'test-management-service'
        working-directory: services/test-management-service
        run: pytest --integration -m integration -v

      - name: Dump integration container logs
        if: failure() && matrix.service == 'test-management-service'
        run: docker compose logs --no-color

      - name: Stop integration containers
        if: always() && matrix.service == 'test-management-service'
        run: docker compose down -v --remove-orphans

      - name: Build production image
        working-directory: services/${{ matrix.service }}
        run: docker build --target production -t ${{ matrix.service }}:ci .

      - name: Scan for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:ci
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif



  frontend-build-test:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4 #version mismatch frontend uses v4 

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          # Must match the packageManager field in frontend/package.json —
          # action-setup errors out if the two disagree
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'frontend/.next/**/*'

      - name: Test
        working-directory: frontend
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/
