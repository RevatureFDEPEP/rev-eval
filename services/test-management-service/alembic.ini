# Alembic configuration for test-management-service.
#
# The database URL is intentionally left blank here and injected at runtime in
# migrations/env.py from the DATABASE_URL env var (falling back to the service
# settings), so it matches the exact precedence used by src/db/session.py.

[alembic]
# Path to migration scripts, relative to this file's directory.
script_location = migrations

# Template used to generate migration file names.
# file_template = %%(rev)s_%%(slug)s

# Timezone for migration file timestamps (blank = local time).
# timezone =

# Left blank on purpose — set in env.py.
sqlalchemy.url =

# NOTE: After generating a revision, run `ruff format` and `ruff check --fix`
# over migrations/versions/ so the new file passes the repo-root CI lint gate.
# A post_write_hook is intentionally omitted because it would require ruff to be
# installed on the same interpreter that runs alembic (not guaranteed in CI/docker).

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
