[pytest]
# `pythonpath = .` puts the service root on sys.path so tests can `from src...`
# the same way the app does. Run pytest from this service dir.
pythonpath = .
testpaths = tests
addopts = -q
# auto mode: `async def test_*` and async fixtures run without per-item
# @pytest.mark.asyncio decorators (pytest-asyncio is a dev/CI dependency).
asyncio_mode = auto
markers =
    integration: exercises real Postgres/Mongo containers; skipped unless --integration is passed
