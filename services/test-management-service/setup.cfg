[coverage:run]
source = src
omit =
    src/v1/*
    src/services/*
    src/utils/*
    src/config/*
    src/db/*
    src/repositories/skill_repository.py
    src/repositories/test_skill_repository.py
    src/repositories/test_submission_repository.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
