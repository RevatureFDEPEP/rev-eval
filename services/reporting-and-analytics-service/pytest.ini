[pytest]
# `pythonpath = .` puts the service root on sys.path so tests can `from src...`
# the same way the app does. Run pytest from this service dir.
pythonpath = .
testpaths = tests
addopts = -q
# Async tests/fixtures run without per-test @pytest.mark.asyncio decorators
# (pytest-asyncio is a dev/CI dependency) — matches test-management-service.
asyncio_mode = auto
