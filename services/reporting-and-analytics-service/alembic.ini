# Alembic configuration for reporting-and-analytics-service.
# The database URL is supplied at runtime by migrations/env.py (from settings),
# so sqlalchemy.url is intentionally left blank here.
#
# NOTE: this service currently owns NO tables — it reads test-management's data
# from the shared database (see adr/0001-cross-service-data-access.md). The
# Alembic env is scaffolded for future reporting-owned tables and uses an
# isolated version_table so it never collides with test-management's history.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
