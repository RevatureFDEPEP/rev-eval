# Knowledge-graph dev tool — model runtime ONLY.
# Deliberately separate from the repo-root docker-compose.yml: this is not part of
# the deployed rev-eval stack. Gated behind the `kg` profile so `docker compose up`
# at the repo root never starts it. Toggle via `python kg.py up|down`.
name: rev-eval-kg

services:
  ollama:
    image: ollama/ollama:latest
    container_name: rev-eval-kg-ollama
    profiles: ["kg"]
    ports:
      - "11434:11434"
    environment:
      # Keep the model warm during active use, then auto-unload after this idle
      # window (default 5m) → RAM freed when you stop querying, but NOT reloaded
      # between the hundreds of calls a single ingest makes. `kg.py down` is the
      # hard "free all RAM now" switch. Set KG_KEEP_ALIVE=0 for zero idle RAM at
      # the cost of a model reload on EVERY request (cripplingly slow for ingest).
      OLLAMA_KEEP_ALIVE: "${KG_KEEP_ALIVE:-5m}"
    volumes:
      # Persist pulled models across on/off cycles so we don't re-download.
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # GPU opt-in: requires the NVIDIA Container Toolkit on the host
    # (`nvidia-ctk`, docker `nvidia` runtime). Without it, leave commented —
    # Ollama runs CPU-only. Uncomment to offload to the GPU(s):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama-models:
